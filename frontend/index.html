<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NutValley — Premium Nuts & Dry Fruits</title>
  <meta name="description"
    content="NutValley — premium almonds, cashews, pistachios, walnuts, dates, raisins, seeds and gift boxes. Packed fresh in India." />
  <meta name="keywords"
    content="NutValley, nuts, dry fruits, almonds, cashews, pistachios, walnuts, dates, raisins, seeds, dry fruit gift box, healthy snacks" />
  <meta name="author" content="NutValley" />
  <meta name="robots" content="index, follow" />

  <!-- Brand / PWA -->
  <meta name="theme-color" content="#1a4d23" />
  <meta name="color-scheme" content="light" />
  <link rel="icon" type="image/png" sizes="64x64" href="/icon-64.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="NutValley" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- Default share preview (pages override these via components/Seo.jsx).
       Social apps need an absolute image URL, so previews show the image only
       once the site is live on its real domain. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="NutValley" />
  <meta property="og:title" content="NutValley — Premium Nuts & Dry Fruits" />
  <meta property="og:description"
    content="Premium almonds, cashews, pistachios, dates and more. Packed fresh, delivered across India." />
  <meta property="og:image" content="/og-image.png" />
  <meta property="og:locale" content="en_IN" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="NutValley — Premium Nuts & Dry Fruits" />
  <meta name="twitter:description"
    content="Premium almonds, cashews, pistachios, dates and more. Packed fresh, delivered across India." />
  <meta name="twitter:image" content="/og-image.png" />

  <!-- Fonts: Inter (body) + Playfair Display (headings), as in tailwind.config.js -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Light-only store: paint the brand background before the app loads (no dark flash). -->
  <style>
    html, body { background: #fbf6ea; color: #1a4d23; }
  </style>
</head>

<body>
  <noscript>
    <p style="padding:24px;text-align:center;font-family:sans-serif">
      Please enable JavaScript to shop at NutValley.
    </p>
  </noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
